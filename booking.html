<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Boat Rental | Beachside Circle Boats</title>
  <link rel="icon" type="image/jpeg" href="images/logo/circleboat logo.jpg">
  <meta property="og:title" content="Book a Circle Boat — Orange Beach, AL">
  <meta property="og:description" content="Reserve your eco-friendly circle boat rental in Orange Beach, Alabama.">
  <meta property="og:image" content="https://beachsidecircleboats.com/images/logo/circleboat%20logo.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <script src="js/load-site-data.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #00ada8;
      --teal-dark: #009590;
      --black: #1a1a1a;
      --gray: #666;
      --border: #e8e8e8;
      --bg: #fafafa;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--black);
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    header {
      background: var(--teal);
      color: white;
      padding: 40px 0;
      text-align: center;
      margin-bottom: 40px;
    }
    h1 { font-size: 36px; margin-bottom: 8px; }
    .subtitle { font-size: 16px; opacity: 0.9; }

    .booking-form {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--black);
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0, 173, 168, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .boat-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .boat-card {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .boat-card:hover {
      border-color: var(--teal);
      background: rgba(0, 173, 168, 0.05);
    }

    .boat-card.selected {
      border-color: var(--teal);
      background: rgba(0, 173, 168, 0.1);
    }

    .boat-card-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .boat-card-price {
      color: var(--teal);
      font-weight: 700;
      font-size: 18px;
    }

    .boat-card-desc {
      font-size: 12px;
      color: var(--gray);
      margin-top: 4px;
    }

    .qty-selector {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .qty-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .qty-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .qty-display {
      min-width: 60px;
      text-align: center;
      font-weight: 600;
    }

    .price-summary {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin: 32px 0;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .price-row.total {
      border-top: 2px solid var(--border);
      padding-top: 12px;
      font-weight: 700;
      font-size: 18px;
      color: var(--teal);
    }

    button {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--teal);
      color: white;
    }

    .btn-primary:hover {
      background: var(--teal-dark);
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .error {
      color: #e74c3c;
      font-size: 14px;
      margin-top: 4px;
    }

    .success-message {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .form-row, .boat-selector {
        grid-template-columns: 1fr;
      }
      .booking-form {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Book Your Adventure</h1>
      <p class="subtitle">Select your dates and boat type</p>
    </div>
  </header>

  <!-- Blackout Date Popup -->
  <div id="blackout-popup" style="display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(0,0,0,.55);">
    <div style="background:#fff;border-radius:16px;padding:36px 32px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);">
      <div style="font-size:48px;margin-bottom:12px;">🚫</div>
      <h2 style="font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:8px;">Not Available</h2>
      <p id="blackout-popup-msg" style="font-size:15px;color:#555;margin-bottom:24px;line-height:1.5;">Sorry, we are not accepting bookings on this date.</p>
      <button onclick="closeBlackoutPopup()" style="background:var(--teal);color:#fff;border:none;border-radius:8px;padding:12px 32px;font-size:15px;font-weight:600;cursor:pointer;width:100%;">Choose Another Date</button>
    </div>
  </div>

  <div class="container">
    <form class="booking-form" id="bookingForm">

      <!-- Date -->
      <div class="form-group">
        <label for="bookingDate">Booking Date *</label>
        <input type="date" id="bookingDate" name="bookingDate" required min="">
        <div class="error" id="dateError"></div>
      </div>

      <!-- Time Slot -->
      <div class="form-group">
        <label>Time Slot *</label>
        <div class="slot-grid" id="slotGrid">
          <div class="slot-btn" data-slot="am">
            <strong>Half Day AM</strong>
            <span>9:00 – 1:00</span>
            <div class="slot-price" id="slotAM">$150</div>
          </div>
          <div class="slot-btn" data-slot="pm">
            <strong>Half Day PM</strong>
            <span>2:00 – 6:00</span>
            <div class="slot-price" id="slotPM">$150</div>
          </div>
          <div class="slot-btn" data-slot="all">
            <strong>All Day</strong>
            <span>9:00 – 6:00</span>
            <div class="slot-price" id="slotAll">$225</div>
          </div>
        </div>
        <div class="error" id="slotError"></div>
      </div>

      <!-- Boats -->
      <div class="form-group">
        <label>Choose Your Boats * <span style="font-weight:400;color:var(--gray);font-size:13px;">Mix &amp; match, add as many as you like</span></label>
        <div id="boatList"></div>
        <div class="error" id="boatError"></div>
      </div>

      <!-- Customer Info -->
      <div class="form-row">
        <div class="form-group">
          <label for="customerName">Your Name *</label>
          <input type="text" id="customerName" name="customerName" required>
        </div>
        <div class="form-group">
          <label for="customerPhone">Phone *</label>
          <input type="tel" id="customerPhone" name="customerPhone" required>
        </div>
      </div>

      <div class="form-group">
        <label for="customerEmail">Email *</label>
        <input type="email" id="customerEmail" name="customerEmail" required>
      </div>

      <div class="form-group">
        <label for="notes">Special Requests (optional)</label>
        <textarea id="notes" name="notes" style="width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-family:inherit;min-height:80px;resize:vertical;font-size:16px;"></textarea>
      </div>

      <!-- Price Summary -->
      <div class="price-summary" id="priceSummary">
        <div class="price-row total"><span>Total:</span><span id="totalPrice">$0</span></div>
      </div>

      <!-- Terms -->
      <div class="form-group">
        <label style="display:flex;align-items:flex-start;gap:10px;font-weight:normal;cursor:pointer;font-size:14px;">
          <input type="checkbox" id="agreeTerms" name="agreeTerms" style="width:auto;margin-top:2px;flex-shrink:0;" required>
          <span>I agree to the <a href="#" style="color:var(--teal);">rental terms</a> and understand I will sign a waiver at check-in.</span>
        </label>
        <div class="error" id="termsError"></div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Continue to Checkout →</button>
    </form>
  </div>

  <style>
    .slot-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
    .slot-btn { border:2px solid var(--border); border-radius:8px; padding:14px 10px; text-align:center; cursor:pointer; transition:all .15s; }
    .slot-btn:hover { border-color:var(--teal); }
    .slot-btn.selected { border-color:var(--teal); background:rgba(0,173,168,.08); }
    .slot-btn strong { display:block; font-size:13px; margin-bottom:2px; }
    .slot-btn span { font-size:11px; color:var(--gray); display:block; }
    .slot-price { font-weight:700; color:var(--teal); font-size:15px; margin-top:4px; }
    .boat-row { display:flex; align-items:center; gap:14px; padding:14px 16px; border:2px solid var(--border); border-radius:10px; margin-bottom:10px; transition:border-color .15s; }
    .boat-row.active { border-color:var(--teal); background:rgba(0,173,168,.06); }
    .boat-row-img { width:68px; height:52px; border-radius:8px; object-fit:cover; flex-shrink:0; }
    .boat-row-info { flex:1; }
    .boat-row-info h4 { font-size:15px; font-weight:700; margin-bottom:2px; color:#1a1a1a; }
    .boat-row-info p { font-size:12px; color:var(--gray); margin:0; }
    .boat-row-price { font-size:13px; font-weight:700; color:var(--teal); white-space:nowrap; margin-right:6px; }
    .qty-ctrl { display:flex; align-items:center; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .qty-ctrl button { width:38px; height:38px; border:none; background:#fafafa; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .qty-ctrl button:hover { background:var(--border); }
    .qty-ctrl span { width:36px; text-align:center; font-weight:700; font-size:15px; }
    .avail-badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; margin-top:3px; }
    @media (max-width:600px) {
      .slot-grid { grid-template-columns:1fr 1fr; }
      .form-row { grid-template-columns:1fr; }
      .boat-row { flex-wrap:wrap; gap:10px; }
      .qty-ctrl button { width:44px; height:44px; }
    }
  </style>

  <script>
    const API_BASE = window.location.hostname === 'localhost'
      ? 'http://localhost:3000'
      : 'https://cybercheck-api-database.vercel.app';
    const SUBDOMAIN = 'beachside-circle-boats';

    function apiUrl(path) {
      const sep = path.includes('?') ? '&' : '?';
      return API_BASE + '/api/public' + path + sep + 'subdomain=' + SUBDOMAIN;
    }

    const PRICES = {
      single: { am: 150, pm: 150, all: 225 },
      double: { am: 200, pm: 200, all: 275 }
    };
    const TAX_RATE = 0.10;

    let state = { slot: null, boats: {}, avail: {}, availLoading: false, blackoutRanges: [] };

    function isBlackedOut(dateStr) {
      return state.blackoutRanges.some(r => dateStr >= r.date_from && dateStr <= r.date_to);
    }

    function getBlackoutLabel(dateStr) {
      const match = state.blackoutRanges.find(r => dateStr >= r.date_from && dateStr <= r.date_to);
      return match ? (match.label || 'Unavailable') : null;
    }

    function showBlackoutPopup(dateStr) {
      const label = getBlackoutLabel(dateStr);
      const msg = label && label !== 'Unavailable'
        ? 'We are closed for <strong>' + label + '</strong> and not accepting bookings on this date. Please choose another date.'
        : 'We are not accepting bookings on this date. Please choose another date.';
      document.getElementById('blackout-popup-msg').innerHTML = msg;
      document.getElementById('blackout-popup').style.display = 'flex';
    }

    function closeBlackoutPopup() {
      document.getElementById('blackout-popup').style.display = 'none';
      document.getElementById('bookingDate').focus();
    }

    // ── Init ──
    function init() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('bookingDate').min = tomorrow.toISOString().split('T')[0];

      // Load blackout dates
      fetch(apiUrl('/blackout-dates'))
        .then(r => r.json())
        .then(data => { state.blackoutRanges = data.blackout_dates || []; })
        .catch(() => {});

      document.querySelectorAll('.slot-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          state.slot = btn.dataset.slot;
          renderBoats();
          updateTotal();
        });
      });

      document.getElementById('bookingDate').addEventListener('change', function() {
        const dateErr = document.getElementById('dateError');
        if (this.value && isBlackedOut(this.value)) {
          showBlackoutPopup(this.value);
          this.value = '';
          return;
        }
        dateErr.textContent = '';
        if (this.value) fetchAvail(this.value);
      });

      document.getElementById('bookingForm').addEventListener('submit', handleSubmit);

      // Load products from API
      fetch(apiUrl('/fleet'))
        .then(r => r.json())
        .then(data => {
          if (data.products) {
            data.products.forEach(p => {
              const k = p.key || p.name.toLowerCase().split(' ')[0];
              PRICES[k] = { am: p.halfDayAM || 0, pm: p.halfDayPM || 0, all: p.allDay || 0 };
            });
            updateSlotPrices();
          }
        }).catch(() => {});

      renderBoats();
    }

    function updateSlotPrices() {
      // Update displayed prices using first boat type as reference
      const keys = Object.keys(PRICES);
      if (!keys.length) return;
      renderBoats();
    }

    // ── Availability ──
    function fetchAvail(date) {
      state.avail = {}; state.availLoading = true; renderBoats();
      fetch(apiUrl('/availability') + '&date=' + date)
        .then(r => r.json())
        .then(data => {
          state.availLoading = false;
          (data.availability || []).forEach(row => {
            const k = row.fleet_type_name.toLowerCase().split(' ')[0];
            const sn = (row.time_slot_name || '').toLowerCase();
            const slot = sn.includes('pm') ? 'pm' : sn.includes('am') ? 'am' : 'all';
            if (!state.avail[k]) state.avail[k] = {};
            state.avail[k][slot] = row.blocked ? 0 : row.available;
          });
          renderBoats();
        }).catch(() => { state.availLoading = false; renderBoats(); });
    }

    function getAvail(key) {
      if (!state.avail[key]) return null;
      if (state.slot) return state.avail[key][state.slot] ?? null;
      const vals = Object.values(state.avail[key]);
      return vals.length ? Math.min(...vals) : null;
    }

    // ── Boats ──
    const FALLBACK_BOATS = [
      { key:'single', name:'Single Seater', description:'1 person max', image:'images/goboat/goboat-hero.jpg' },
      { key:'double', name:'Double Seater', description:'2 person max', image:'images/goboat/goboat-onwater1.jpg' }
    ];

    function renderBoats() {
      const container = document.getElementById('boatList');
      const products = (window._bkProducts && window._bkProducts.length) ? window._bkProducts : FALLBACK_BOATS;

      if (state.availLoading) {
        container.innerHTML = '<p style="color:#888;font-size:13px;padding:8px 0;">Checking availability…</p>';
        return;
      }

      container.innerHTML = products.map(p => {
        const key = p.key || p.name.toLowerCase().split(' ')[0];
        const qty = state.boats[key] || 0;
        const price = state.slot && PRICES[key] ? PRICES[key][state.slot] : (PRICES[key] ? PRICES[key].am : 0);
        const priceStr = state.slot ? '$' + price + '/ea' : 'from $' + (PRICES[key] ? PRICES[key].am : '?');
        const avail = getAvail(key);
        let badge = '';
        if (avail !== null) {
          const bc = avail === 0 ? '#ef4444' : avail <= 2 ? '#f59e0b' : '#10b981';
          badge = `<span class="avail-badge" style="color:${bc};background:${bc}18;">${avail === 0 ? 'Sold out' : avail + ' left'}</span>`;
        }
        const soldOut = avail !== null && avail === 0;
        return `<div class="boat-row${qty > 0 ? ' active' : ''}" id="brow-${key}"${soldOut ? ' style="opacity:.5;pointer-events:none;"' : ''}>
          ${p.image ? `<img class="boat-row-img" src="${p.image}" alt="${p.name}">` : ''}
          <div class="boat-row-info"><h4>${p.name}</h4><p>${p.description || ''}</p>${badge}</div>
          <span class="boat-row-price">${priceStr}</span>
          <div class="qty-ctrl">
            <button type="button" onclick="chgBoat('${key}',-1)">−</button>
            <span id="bqty-${key}">${qty}</span>
            <button type="button" onclick="chgBoat('${key}',1)">+</button>
          </div>
        </div>`;
      }).join('');
    }

    function chgBoat(key, delta) {
      const avail = getAvail(key);
      const max = avail !== null ? avail : 20;
      state.boats[key] = Math.max(0, Math.min(max, (state.boats[key] || 0) + delta));
      const sp = document.getElementById('bqty-' + key);
      if (sp) sp.textContent = state.boats[key];
      const row = document.getElementById('brow-' + key);
      if (row) row.classList.toggle('active', state.boats[key] > 0);
      updateTotal();
    }

    function totalQty() {
      return Object.values(state.boats).reduce((s, v) => s + v, 0);
    }

    // ── Pricing ──
    function updateTotal() {
      let subtotal = 0;
      const lines = [];
      Object.entries(state.boats).forEach(([k, qty]) => {
        if (!qty || !state.slot || !PRICES[k]) return;
        const unit = PRICES[k][state.slot] || 0;
        subtotal += unit * qty;
        lines.push(`<div class="price-row"><span>${k.charAt(0).toUpperCase()+k.slice(1)} Seater ×${qty}</span><span>$${unit * qty}</span></div>`);
      });
      const tax = Math.round(subtotal * TAX_RATE * 100) / 100;
      const total = subtotal + tax;

      const el = document.getElementById('priceSummary');
      if (subtotal > 0) {
        el.innerHTML = lines.join('') +
          `<div class="price-row"><span style="color:var(--gray);">Tax (10%)</span><span style="color:var(--gray);">$${tax.toFixed(2)}</span></div>` +
          `<div class="price-row total"><span>Total</span><span id="totalPrice">$${total.toFixed(2)}</span></div>`;
      } else {
        el.innerHTML = `<div class="price-row total"><span>Total</span><span id="totalPrice">$0</span></div>`;
      }
    }

    // ── Submit ──
    async function handleSubmit(e) {
      e.preventDefault();
      document.getElementById('boatError').textContent = '';
      document.getElementById('slotError').textContent = '';

      const bookingDate = document.getElementById('bookingDate').value;
      if (!bookingDate) { document.getElementById('dateError').textContent = 'Please select a date'; return; }
      if (isBlackedOut(bookingDate)) {
        showBlackoutPopup(bookingDate);
        return;
      }
      if (!state.slot) { document.getElementById('slotError').textContent = 'Please select a time slot'; return; }
      if (totalQty() === 0) { document.getElementById('boatError').textContent = 'Please add at least 1 boat'; return; }

      const boatsArr = Object.entries(state.boats)
        .filter(([, qty]) => qty > 0)
        .map(([k, qty]) => ({ type: k, qty, price: PRICES[k] ? PRICES[k][state.slot] : 0 }));

      const subtotal = boatsArr.reduce((s, b) => s + b.price * b.qty, 0);
      const tax = Math.round(subtotal * TAX_RATE * 100) / 100;
      const total = subtotal + tax;

      const desc = boatsArr.map(b => `${b.qty}× ${b.type.charAt(0).toUpperCase()+b.type.slice(1)}`).join(', ');

      const payload = {
        booking_date: document.getElementById('bookingDate').value,
        slot: state.slot,
        boats: boatsArr,
        qty: totalQty(),
        subtotal, tax, total,
        customer_name: document.getElementById('customerName').value,
        customer_phone: document.getElementById('customerPhone').value,
        customer_email: document.getElementById('customerEmail').value,
        notes: document.getElementById('notes').value,
        subdomain: SUBDOMAIN
      };

      sessionStorage.setItem('bookingData', JSON.stringify({ ...payload, desc }));

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Creating hold…';

      try {
        const r = await fetch(API_BASE + '/api/public/hold', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const hold = await r.json();
        if (hold.id) sessionStorage.setItem('holdId', hold.id);
        window.location.href = 'checkout.html';
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false; btn.textContent = 'Continue to Checkout →';
      }
    }

    init();
  </script>
</body>
</html>
